# phiOS kernel hardening. "strict but usable": user namespaces stay on so
# browser sandboxes and Flatpak work, SMT stays on.

# hide kernel pointers and the kernel log from users
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.printk = 3 3 3 3

# BPF: root only, JIT hardened
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# no kexec into another kernel at runtime
kernel.kexec_load_disabled = 1

# ptrace attach is admin-only. gdb ./prog still works, gdb -p needs sudo
kernel.yama.ptrace_scope = 2

# perf events: root only
kernel.perf_event_paranoid = 3

# magic sysrq off
kernel.sysrq = 0

# io_uring: root only (big attack surface, almost nothing on a desktop needs it)
kernel.io_uring_disabled = 1

# panic after 100 oopses/warnings, so a kernel bug can't be hammered until it lands
kernel.oops_limit = 100
kernel.warn_limit = 100

# defaults on Debian, pinned so nothing quietly changes them
kernel.randomize_va_space = 2
vm.mmap_min_addr = 65536

# tty tricks used by local privesc exploits
dev.tty.ldisc_autoload = 0
dev.tty.legacy_tiocsti = 0

# userfaultfd is a classic exploit helper
vm.unprivileged_userfaultfd = 0

# max ASLR entropy
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16

# filesystem link/fifo protections, no setuid core dumps
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0

# network
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.conf.all.log_martians = 1
# the kernel ignores router adverts; NetworkManager processes them itself, so SLAAC still works
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# checked against kernel-hardening-checker. deliberately NOT set, they break a normal desktop:
#   user.max_user_namespaces=0   Flatpak and browser sandboxes need user namespaces
#   kernel.modules_disabled=1    USB devices plugged in after boot would stop working
#   kernel.io_uring_disabled=2   1 already limits it to root
#   kernel.yama.ptrace_scope=3   2 keeps debugging possible for root
