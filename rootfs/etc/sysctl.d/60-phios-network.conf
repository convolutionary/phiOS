# phiOS: fast single connections, especially through a VPN.
# CUBIC (Debian's default) halves its window at every lost packet, and a WireGuard tunnel to a
# far-away relay always loses a few. Measured on a 5 Gbit line through Mullvad: one TCP stream
# stuck at ~170 Mbit/s while four streams together did 765. BBR paces by measured bandwidth
# and RTT instead of loss. It wants the fq qdisc.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# room for a multi-gigabit window at 30-80 ms (bandwidth x delay); autotuning still starts small
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_rmem = 4096 131072 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432
