# phiOS GRUB settings, sourced after /etc/default/grub

GRUB_DISTRIBUTOR="phiOS"
GRUB_TIMEOUT=5
GRUB_DISABLE_OS_PROBER=true
# text-mode fallback colours, used only if the graphical theme can't load
GRUB_COLOR_NORMAL="light-gray/black"
GRUB_COLOR_HIGHLIGHT="yellow/black"

# the phiOS theme. it sits on /boot because GRUB can't read the encrypted root.
# 1920x1080 keeps the layout identical on every monitor; "auto" catches firmware without that mode
GRUB_THEME="/boot/grub/themes/phios/theme.txt"
GRUB_GFXMODE="1920x1080,auto"
GRUB_TERMINAL_OUTPUT="gfxterm"

# kernel hardening, checked against kernel-hardening-checker. see README "Hardening".
# left out on purpose: nosmt (big CPU cost), ia32_emulation=0 (breaks Steam/Wine 32-bit),
# pti / intel_iommu (Intel only), cfi=kcfi (Debian's kernel isn't built with clang CFI)
PHI_HARDEN="lockdown=confidentiality module.sig_enforce=1 slab_nomerge init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1 randomize_kstack_offset=on hardened_usercopy=1 kfence.sample_interval=100 vsyscall=none debugfs=off iommu=force iommu.strict=1 iommu.passthrough=0 efi=disable_early_pci_dma bdev_allow_write_mounted=0 proc_mem.force_override=ptrace random.trust_cpu=off random.trust_bootloader=off"
PHI_NVIDIA="nvidia-drm.modeset=1"

GRUB_CMDLINE_LINUX_DEFAULT="quiet loglevel=3 $PHI_HARDEN $PHI_NVIDIA"
